server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/bookingdb
    username: postgres
    password: postgres
    hikari:
      pool-name: BookingPool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserialize
      properties:
        max.block.ms: 3000

    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.type.mapping: "\
          seatBooked:com.rahul.bookingservice.kafka.event.cinema.SeatBookedEvent,\
          seatBookingFailed:com.rahul.bookingservice.kafka.event.cinema.SeatBookingFailedEvent,\
          paymentCompleted:com.rahul.bookingservice.kafka.event.payment.PaymentCompletedEvent,\
          paymentFailed:com.rahul.bookingservice.kafka.event.payment.PaymentFailedEvent,\
          refundCompleted:com.rahul.bookingservice.kafka.event.payment.RefundCompletedEvent,\
          refundFailed:com.rahul.bookingservice.kafka.event.payment.RefundFailedEvent"