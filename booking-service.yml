server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/bookingdb
    username: ticketuser
    password: ticketpass
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.rahul.bookingservice: DEBUG