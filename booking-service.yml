server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/bookingdb
    username: postgres
    password: postgres
    hikari:
      pool-name: BookingPool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max.block.ms: 3000
        spring.json.type.mapping: bookingRequested:com.rahul.bookingservice.event.BookingRequested