server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/bookingdb
    username: postgres
    password: postgres
    hikari:
      pool-name: BookingPool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration