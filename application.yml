eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true      # register with the IP, so name lookup works on any machine

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Used by the gateway and every service that verifies the token (Option 2).
# The real secret comes from the JWT_SECRET environment variable. The default is for local dev only.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-this-must-be-at-least-32-bytes-long}

# Shared secret for /internal/** calls between services. Never routed by the Gateway.
internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}

spring:
  kafka:
    bootstrap-servers: localhost:9092
