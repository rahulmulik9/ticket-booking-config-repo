eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: dev-only-secret-key-change-in-prod-min-32-chars

logging:
  level:
    root: ERROR
    com.rahul.bookingservice.kafka: INFO
    com.rahul.cinemaservice.kafka: INFO
    com.rahul.paymentservice.kafka: INFO
    com.rahul.notificationservice.kafka: INFO