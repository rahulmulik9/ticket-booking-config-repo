eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-stacktrace: never
    include-message: always

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: dev-only-secret-key-change-in-prod-min-32-chars