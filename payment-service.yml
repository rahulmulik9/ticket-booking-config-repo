server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/paymentdb
    username: postgres
    password: postgres
    hikari:
      pool-name: PaymentPool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.type.mapping: paymentRequest:com.rahul.paymentservice.kafka.event.PaymentRequestEvent,refundRequest:com.rahul.paymentservice.kafka.event.RefundRequestEvent,seatReservation:com.rahul.paymentservice.kafka.event.IgnoredEvent,seatRelease:com.rahul.paymentservice.kafka.event.IgnoredEvent,bookingCompleted:com.rahul.paymentservice.kafka.event.IgnoredEvent,bookingFailed:com.rahul.paymentservice.kafka.event.IgnoredEvent,bookingCancelled:com.rahul.paymentservice.kafka.event.IgnoredEvent

# The fake gateway declines any amount above this. Lower it to test the FAILED path.
payment:
  gateway:
    max-amount: 10000
    fail-refunds: false