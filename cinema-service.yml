server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/cinemadb
    username: postgres
    password: postgres
    hikari:
      pool-name: CinemaPool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = '3s'   # seat locks live here, so a lock wait over 3s fails
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  spring:
    kafka:
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
        properties:
          max.block.ms: 3000
          spring.json.type.mapping: seatBooked:com.rahul.cinemaservice.kafka.event.SeatBookedEvent,seatBookingFailed:com.rahul.cinemaservice.kafka.event.SeatBookingFailedEvent
      consumer:
        group-id: cinema-service
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        properties:
          spring.json.type.mapping: "\
                    seatReservation:com.rahul.cinemaservice.kafka.event.SeatReservationEvent,\
                    seatRelease:com.rahul.cinemaservice.kafka.event.SeatReleaseEvent,\
                    paymentRequest:com.rahul.cinemaservice.kafka.event.IgnoredEvent,\
                    refundRequest:com.rahul.cinemaservice.kafka.event.IgnoredEvent,\
                    bookingCompleted:com.rahul.cinemaservice.kafka.event.IgnoredEvent,\
                    bookingFailed:com.rahul.cinemaservice.kafka.event.IgnoredEvent,\
                    bookingCancelled:com.rahul.cinemaservice.kafka.event.IgnoredEvent"