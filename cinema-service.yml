server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/cinemadb
    username: ticketuser
    password: ticketpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

seat-hold:
  ttl-seconds: 30   # not used yet, it comes into play in the Redis stage

logging:
  level:
    root: INFO
    com.rahul.cinemaservice: DEBUG
