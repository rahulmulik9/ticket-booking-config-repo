server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/cinemadb
    username: postgres
    password: postgres
    hikari:
      pool-name: CinemaPool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = '3s'   # seat locks live here, so a lock wait over 3s fails
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration