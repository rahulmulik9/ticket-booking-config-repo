server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false    # keep OFF. When on, it creates a route for every service, including /internal/**
          routes:
            - id: user-service
              uri: lb://user-service            # lb:// means "find it in Eureka by name"
              predicates:
                - Path=/api/v1/auth/**

            - id: cinema-service
              uri: lb://cinema-service
              predicates:
                - Path=/api/v1/movies/**,/api/v1/shows/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**